  :root {
    --ink: #0B0C0E; --surface: #15171A; --raised: #1C1F23;
    --cream: #F4EFE8; --cream-dim: rgba(244,239,232,.66); --cream-faint: rgba(244,239,232,.42);
    --hairline: rgba(244,239,232,.12); --cardfill: rgba(244,239,232,.05);
    --lime: #E8FF59; --rust: #B83100; --rust2: #F2693C; --coral: #FF5E4D;
    --font-head: "Zodiak", "Georgia", serif;
    --font-body: "Hanken Grotesk", system-ui, sans-serif;
    --font-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0; background: var(--ink); color: var(--cream);
    font-family: var(--font-body); font-size: 20px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(244,239,232,.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  ::selection { background: var(--lime); color: var(--ink); }
  .layout { position: relative; z-index: 1; display: flex; max-width: 1500px; margin: 0 auto; }

  /* left nav */
  .sidenav {
    position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
    flex: 0 0 260px; padding: 32px 20px 40px 28px;
  }
  .sidenav .brand {
    font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--lime); margin-bottom: 4px;
  }
  .sidenav .doc { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-dim); margin-bottom: 28px; }
  .sidenav a {
    display: block; text-decoration: none; color: var(--cream-dim); font-size: 15px; font-weight: 500;
    padding: 7px 12px; border-radius: 6px; margin-bottom: 2px; border: 1px solid transparent;
  }
  .sidenav a .n { font-family: var(--font-mono); font-size: 11px; color: var(--rust2); margin-right: 8px; }
  .sidenav a:hover { background: var(--cardfill); color: var(--cream); }
  .sidenav a.active { background: var(--cardfill); border-color: var(--hairline); color: var(--lime); }
  .sidenav a.active .n { color: var(--lime); }

  .page { flex: 1; min-width: 0; max-width: 1060px; padding: 0 clamp(20px, 3vw, 48px) 40px; }

  .hero { margin: 52px 0 44px; }
  .hero-eyebrow {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--cream-dim); margin-bottom: 18px;
  }
  .hero-eyebrow::before {
    content: ""; display: inline-block; width: 26px; height: 2px; background: var(--rust2);
    margin-right: 12px; vertical-align: middle; transform: translateY(-2px);
  }
  .hero-title {
    font-family: var(--font-head); font-weight: 500; font-size: clamp(38px, 5vw, 62px);
    line-height: 1.05; letter-spacing: -0.02em; color: var(--cream); margin: 0 0 18px;
  }
  .hero-title .accent { color: var(--lime); }
  .hero-sub { font-size: clamp(18px, 1.6vw, 21px); line-height: 1.62; max-width: 760px; margin: 0; color: var(--cream-dim); }
  .hero-meta {
    margin-top: 30px; padding: 16px 20px; background: var(--cardfill); border: 1px solid var(--hairline);
    border-radius: 6px; display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; color: var(--cream);
    font-family: var(--font-mono);
  }
  .hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
  .hero-meta .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .dot.filter { background: var(--lime); }
  .dot.fcomment { background: var(--coral); }
  .dot.comment { background: var(--cream); }
  .dot.alert { background: var(--rust2); }
  .dot.quiet { background: rgba(244,239,232,.35); }

  section.gs { margin: 72px 0; scroll-margin-top: 24px; }
  .sec-num {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--cream-dim); margin-bottom: 14px;
  }
  .sec-num::before {
    content: ""; display: inline-block; width: 26px; height: 2px; background: var(--rust2);
    margin-right: 12px; vertical-align: middle; transform: translateY(-2px);
  }
  .sec-title {
    font-family: var(--font-head); font-weight: 500; font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.1; letter-spacing: -0.015em; color: var(--cream); margin: 0 0 20px; max-width: 820px;
  }
  .sec-body p { margin: 0 0 16px; max-width: 820px; color: var(--cream-dim); }
  .sec-body p strong { color: var(--cream); font-weight: 700; }
  .sec-body ul { max-width: 820px; margin: 0 0 16px; padding-left: 22px; color: var(--cream-dim); }
  .sec-body li { margin-bottom: 8px; }
  .sec-body li strong { color: var(--cream); }
  .sec-body a { color: var(--lime); }

  .callout { margin: 24px 0; padding: 20px 24px; border-radius: 6px; max-width: 880px; border: 1px solid var(--hairline); background: var(--cardfill); }
  .callout.warn { border-color: rgba(242,105,60,.4); background: rgba(242,105,60,.08); }
  .callout.info { border-color: rgba(232,255,89,.3); background: rgba(232,255,89,.05); }
  .callout .c-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 8px; color: var(--rust2);
  }
  .callout.info .c-label { color: var(--lime); }
  .callout .c-head { font-family: var(--font-head); font-weight: 500; font-size: 21px; color: var(--cream); margin: 0 0 6px; }
  .callout p { margin: 0 0 8px; font-size: 16.5px; line-height: 1.55; color: var(--cream-dim); }
  .callout p:last-child { margin-bottom: 0; }
  .callout p strong { color: var(--cream); }

  /* Approved document layout: logo and cursor interaction. */
.ogs-logo{display:block;width:64px;height:auto;aspect-ratio:10/9;margin-bottom:22px}
.hero .ogs-logo{width:88px;margin-bottom:28px}
.hero{position:relative;isolation:isolate}.ogs-dot-grid{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html{scroll-behavior:auto}a:focus-visible,summary:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
.sidenav a{min-height:44px}.template-details{max-width:900px}.template-details summary{padding:16px 0;cursor:pointer;color:var(--cream)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}



#ground{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}body.has-live-grid::before{display:none}

/* NM content direction: slide layer on top of the OGS approved starter */
html { scroll-behavior: smooth; }
.page { max-width: 1120px; }
.slide { min-height: 100vh; margin: 0; padding: 52px 0 44px; display: flex; flex-direction: column; justify-content: center; scroll-margin-top: 0; position: relative; border-bottom: 1px solid var(--hairline); }
.slide:last-of-type { border-bottom: none; }
.slide .sec-title { max-width: 900px; font-size: clamp(28px, 3.6vw, 46px); }
.slide .sec-title .accent { color: var(--lime); font-style: italic; }
.slide .lede { font-size: clamp(18px, 1.5vw, 21px); line-height: 1.55; color: var(--cream-dim); max-width: 820px; margin: 0 0 28px; }
.slide .count { position: absolute; top: 28px; right: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; color: var(--cream-faint); }

/* cover */
.slide.cover .hero { margin: 0 0 30px; }
.slide.cover .cover-meta { margin-top: 26px; }
.slide.cover .cover-hint { margin-top: 22px; }
.slide.cover .hero-title { font-size: clamp(44px, 6vw, 80px); max-width: 980px; }
.slide.cover .hero-title .accent { font-style: italic; }
.cover-meta { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px 26px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-dim); }
.cover-meta .lime { color: var(--lime); }
.cover-hint { margin-top: 48px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--cream-faint); }
.cover-hint kbd { font-family: var(--font-mono); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 7px; color: var(--cream-dim); }

/* blocks */
.blk { margin: 0 0 22px; max-width: 1000px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { background: var(--cardfill); border: 1px solid var(--hairline); border-radius: 6px; padding: 20px 20px 18px; }
.stat:first-child { border-color: rgba(232,255,89,.4); background: rgba(232,255,89,.06); }
.stat .n { font-family: var(--font-mono); font-weight: 700; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.05; color: var(--cream); }
.stat:first-child .n { color: var(--lime); }
.stat .l { margin-top: 8px; font-size: 15.5px; line-height: 1.4; color: var(--cream-dim); }

.cards { display: grid; gap: 16px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.card { background: var(--cardfill); border: 1px solid var(--hairline); border-radius: 6px; padding: 22px 22px 18px; position: relative; overflow: hidden; }
.card .wm { position: absolute; right: 12px; top: -10px; font-family: var(--font-mono); font-weight: 700; font-size: 76px; color: rgba(244,239,232,.045); pointer-events: none; }
.card .tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 12px; background: rgba(244,239,232,.1); color: var(--cream); }
.card:nth-child(1) .tag { background: rgba(232,255,89,.14); color: var(--lime); }
.card:nth-child(2) .tag { background: rgba(242,105,60,.16); color: #F5A183; }
.card:nth-child(3) .tag { background: rgba(255,94,77,.14); color: #FF8F80; }
.card h4 { font-family: var(--font-head); font-weight: 500; font-size: 21px; line-height: 1.22; color: var(--cream); margin: 0 0 8px; }
.card p { margin: 0 0 8px; font-size: 16px; line-height: 1.5; color: var(--cream-dim); }
.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 15.5px; line-height: 1.45; color: var(--cream-dim); }
.card li { margin-bottom: 5px; }

.steps { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; counter-reset: st; }
.step { flex: 1 1 160px; background: var(--cardfill); border: 1px solid var(--hairline); border-radius: 6px; padding: 16px 16px 14px; position: relative; }
.step::before { counter-increment: st; content: counter(st, decimal-leading-zero); display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--lime); margin-bottom: 8px; }
.step h4 { font-family: var(--font-head); font-weight: 500; font-size: 18.5px; line-height: 1.25; color: var(--cream); margin: 0 0 6px; }
.step p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--cream-dim); }

.list h5, .split h5 { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cream-dim); margin: 0 0 10px; }
.list ul, .split ul { margin: 0; padding: 0; list-style: none; }
.list li, .split li { position: relative; padding: 0 0 9px 22px; font-size: 17px; line-height: 1.5; color: var(--cream-dim); max-width: 860px; }
.list li::before, .split li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 2px; background: var(--rust2); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split > div { background: var(--cardfill); border: 1px solid var(--hairline); border-radius: 6px; padding: 20px 22px 12px; }
.split > div:first-child { border-color: rgba(232,255,89,.35); }
.split > div:first-child h5 { color: var(--lime); }
.split > div:last-child { border-color: rgba(255,94,77,.35); }
.split > div:last-child h5 { color: #FF8F80; }
.split.neutral > div { border-color: var(--hairline); }
.split.neutral > div h5 { color: var(--rust2); }

.quote { border-left: 2px solid var(--rust2); padding: 4px 0 4px 20px; }
.quote p { margin: 0; font-family: var(--font-head); font-size: clamp(19px, 1.8vw, 24px); line-height: 1.35; color: var(--cream); font-style: italic; }
.quote .src { margin-top: 8px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--cream-faint); }
.quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checklist li { display: flex; gap: 14px; align-items: flex-start; background: var(--cardfill); border: 1px solid var(--hairline); border-radius: 6px; padding: 14px 18px; font-size: 17px; line-height: 1.45; color: var(--cream); cursor: pointer; user-select: none; }
.checklist li .box { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px; border: 1.5px solid rgba(244,239,232,.4); border-radius: 4px; position: relative; }
.checklist li.on { border-color: rgba(232,255,89,.45); }
.checklist li.on .box { background: var(--lime); border-color: var(--lime); }
.checklist li.on .box::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }

.callout-blk { padding: 18px 22px; border-radius: 6px; border: 1px solid rgba(232,255,89,.3); background: rgba(232,255,89,.05); font-size: 17px; line-height: 1.55; color: var(--cream); max-width: 900px; }

.discuss { margin: 6px 0 18px; max-width: 900px; border: 1px dashed rgba(242,105,60,.5); border-radius: 6px; padding: 14px 20px; }
.discuss .dl { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--rust2); margin-bottom: 6px; }
.discuss p { margin: 4px 0; font-size: 17px; line-height: 1.5; color: var(--cream); }

.more { max-width: 1000px; border-top: 1px solid var(--hairline); }
.more:last-child { border-bottom: 1px solid var(--hairline); }
.more summary { cursor: pointer; list-style: none; padding: 13px 2px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; color: var(--cream-dim); display: flex; gap: 12px; align-items: center; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: "+"; font-weight: 700; color: var(--lime); width: 12px; text-align: center; }
.more[open] summary::before { content: "-"; }
.more summary:hover { color: var(--lime); }
.more ul { margin: 0 0 14px; padding-left: 46px; font-size: 15.5px; line-height: 1.5; color: var(--cream-dim); }
.more li { margin-bottom: 6px; }
.mores { margin: 0 0 20px; }

/* deck controls */
.deckbar { position: fixed; right: 20px; bottom: 18px; z-index: 30; display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--cream-dim); background: rgba(21,23,26,.88); border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 8px 6px 14px; backdrop-filter: blur(6px); }
.deckbar button { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--cream); background: transparent; border: 1px solid var(--hairline); border-radius: 5px; padding: 7px 11px; cursor: pointer; min-height: 32px; }
.deckbar button:hover { border-color: rgba(232,255,89,.5); color: var(--lime); }
.deckbar .pos { min-width: 54px; text-align: center; letter-spacing: .1em; }
.progress { position: fixed; left: 0; top: 0; height: 2px; background: var(--lime); z-index: 31; width: 0; transition: width .2s ease; }

/* present mode: hide nav, widen */
body.present .sidenav { display: none; }
body.present .page { max-width: 1240px; margin: 0 auto; }

/* light theme toggle not required: brand is dark-only */

@media (max-width: 1000px) {
  .sidenav { display: none; }
  .page { padding: 0 16px 40px; }
  .step { flex-basis: 100%; }
  .stats { grid-template-columns: 1fr 1fr; }
  .cards { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
  .slide { min-height: auto; padding: 56px 0 40px; }
  .slide .count { top: 22px; }
  .deckbar { right: 12px; bottom: 12px; }
}
@media print {
  .deckbar, .progress, #ground, .sidenav { display: none !important; }
  .slide { min-height: auto; page-break-after: always; }
  details.more { display: block; } details.more > * { display: block; }
}

/* row layout for idea and pillar cards: name | explanation | examples */
.rows { display: grid; gap: 22px; }
.row { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(170px, 0.8fr) minmax(0, 1.5fr) minmax(0, 1.2fr); gap: 36px; padding: 30px 32px; background: var(--cardfill); border: 1px solid var(--hairline); }
.row.nopts { grid-template-columns: minmax(170px, 0.8fr) minmax(0, 2.7fr); }
.row .wm { position: absolute; left: 22px; bottom: -22px; font-family: var(--font-mono); font-weight: 700; font-size: 84px; color: rgba(244,239,232,.045); pointer-events: none; }
.row .tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; margin-bottom: 12px; background: rgba(232,255,89,.14); color: var(--lime); }
.row[data-p="2"] .tag { background: rgba(242,105,60,.16); color: #F5A183; }
.row[data-p="3"] .tag { background: rgba(255,94,77,.14); color: #FF8F80; }
.row h4 { font-family: var(--font-head); font-weight: 500; font-size: 23px; line-height: 1.22; color: var(--cream); margin: 0; }
.row .r-body { margin: 0; font-size: 16.5px; line-height: 1.65; color: var(--cream-dim); }
.row .r-pts { border-left: 1px solid var(--hairline); padding-left: 26px; }
.row .r-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--rust2); margin-bottom: 10px; }
.row ul { margin: 0; padding: 0; list-style: none; }
.row li { position: relative; padding: 0 0 10px 18px; font-size: 15.5px; line-height: 1.5; color: var(--cream); }
.row li::before { content: ""; position: absolute; left: 0; top: .65em; width: 8px; height: 2px; background: var(--lime); }
@media (max-width: 1000px) {
  .row { grid-template-columns: 1fr; gap: 14px; padding: 22px; }
  .row .r-pts { border-left: none; padding-left: 0; border-top: 1px solid var(--hairline); padding-top: 14px; }
}

/* more breathing room everywhere */
.blk { margin-bottom: 30px; }
.cards { gap: 22px; }
.card { padding: 26px 26px 22px; }
.card p { line-height: 1.6; }
.stats { gap: 18px; }
.steps { gap: 16px; }
.step { padding: 20px 20px 18px; }
.split { gap: 22px; }
.split > div { padding: 24px 26px 16px; }
.slide .lede { margin-bottom: 34px; }
.discuss { margin-top: 10px; }

/* square corners on all boxed sections */
.stat, .card, .row, .row .tag, .step, .split > div, .callout-blk, .discuss, .checklist li, .card .tag, .sidenav a, .deckbar, .deckbar button, .callout { border-radius: 0; }

/* NU light theme: National University palette (taken from nu.edu, Oct 2026)
   navy #173761 · primary blue #003A92 · brand teal #23BDC1 · primary-lightest #F0F4FA
   Adapted from the NM v2 theme. Variable names are kept from the OGS starter so the base layout still works:
   --ink is the page background, --cream the main text colour, --lime the blue accent.
   The --gold variables now hold NU teal. */
:root {
  --ink: #FFFFFF; --surface: #F6F8FB; --raised: #EDF0F3;
  --cream: #173761; --cream-dim: #33455F; --cream-faint: #6B7A8F;
  --hairline: #D6DEE8; --cardfill: #F4F7FB;
  --lime: #003A92; --rust2: #003A92; --rust: #003A92; --coral: #003A92;
  --navy: #173761; --deep: #003A92; --blue: #003A92; --sky: #23BDC1; --sky-wash: #F0F4FA; --gold: #23BDC1; --gold-wash: #E6F6F6;
}
html, body { background: #FFFFFF; color: var(--navy); font-size: 22px; }
body::before { display: none; }
::selection { background: var(--sky); color: var(--navy); }

/* side nav */
.sidenav { background: var(--surface); border-right: 1px solid var(--hairline); }
.sidenav .doc { color: var(--cream-faint); }
.sidenav a { color: var(--cream-dim); font-size: 16px; }
.sidenav a .n { color: var(--blue); }
.sidenav a:hover { background: #FFFFFF; color: var(--navy); }
.sidenav a.active { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
.sidenav a.active .n { color: var(--gold); }

/* slide frame */
.page { max-width: 1180px; }
.slide { border-bottom: 1px solid var(--hairline); }
.slide .count { color: var(--cream-faint); font-size: 13px; }
.sec-num { color: var(--blue); font-size: 14px; font-weight: 700; }
.sec-num::before, .hero-eyebrow::before { background: var(--gold); height: 3px; }
.slide .sec-title { color: var(--navy); font-size: clamp(34px, 4.4vw, 58px); line-height: 1.08; max-width: 1000px; margin-bottom: 24px; }
.slide .sec-title .accent, .hero-title .accent { color: var(--blue); }
.slide .lede { color: var(--cream-dim); font-size: clamp(21px, 1.9vw, 26px); line-height: 1.5; max-width: 900px; }

/* cover: navy band in NM's own style */
.slide.cover { background: var(--navy); margin: 0 calc(-1 * clamp(20px, 3vw, 48px)); padding-left: clamp(20px, 3vw, 48px); padding-right: clamp(20px, 3vw, 48px); border-bottom: 6px solid var(--gold); }
.slide.cover .count { right: clamp(20px, 3vw, 48px); color: rgba(255,255,255,.5); }
.slide.cover .hero-title { color: #FFFFFF; font-size: clamp(48px, 6.6vw, 92px); }
.slide.cover .hero-title .accent { color: var(--sky); }
.slide.cover .hero-sub { color: rgba(255,255,255,.82); font-size: clamp(22px, 2vw, 28px); }
.slide.cover .hero-eyebrow, .slide.cover .cover-hint { color: rgba(255,255,255,.65); }
.slide.cover .cover-meta, .cover-meta .lime { color: var(--gold); }
.slide.cover .cover-hint kbd { border-color: rgba(255,255,255,.3); color: #FFFFFF; }
.slide.cover .list h5 { color: var(--gold); }
.slide.cover .list li { color: #FFFFFF; font-size: 23px; }
.slide.cover .list li::before { background: var(--gold); }

/* stats */
.stat { background: var(--cardfill); border: 1px solid var(--hairline); border-top: 4px solid var(--sky); }
.stat:first-child { background: var(--sky-wash); border-color: var(--hairline); border-top-color: var(--blue); }
.stat .n { color: var(--navy); font-size: clamp(38px, 4vw, 56px); }
.stat:first-child .n { color: var(--blue); }
.stat .l { color: var(--cream-dim); font-size: 19px; line-height: 1.4; }

/* callouts: gold, like NM's primary button */
.callout-blk { background: var(--gold-wash); border: none; border-left: 6px solid var(--gold); color: var(--navy); font-size: 23px; line-height: 1.45; font-family: var(--font-head); padding: 22px 28px; }

/* rows (pillars, hooks) */
.rows { gap: 18px; }
.row { background: #FFFFFF; border: 1px solid var(--hairline); border-left: 6px solid var(--blue); grid-template-columns: minmax(200px, 0.9fr) minmax(0, 2fr); gap: 32px; padding: 26px 30px; }
.row.nopts { grid-template-columns: minmax(200px, 0.9fr) minmax(0, 2fr); }
.row[data-p="2"] { border-left-color: var(--deep); }
.row[data-p="3"] { border-left-color: var(--sky); }
.row .tag, .row[data-p="2"] .tag, .row[data-p="3"] .tag { background: var(--sky-wash); color: var(--deep); font-size: 12px; }
.row h4 { color: var(--navy); font-size: 27px; }
.row .r-body { color: var(--cream-dim); font-size: 21px; line-height: 1.5; }
.r-more { margin-top: 12px; }
.r-more summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); padding: 4px 0; }
.r-more summary::-webkit-details-marker { display: none; }
.r-more summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--sky-wash); color: var(--blue); font-size: 15px; }
.r-more[open] summary::before { content: "\2212"; background: var(--blue); color: #FFFFFF; }
.r-more summary:hover { color: var(--navy); }
.r-more ul { margin: 10px 0 0; padding: 14px 18px; list-style: none; background: var(--sky-wash); }
.r-more li { position: relative; padding: 0 0 8px 18px; font-size: 19px; line-height: 1.45; color: var(--navy); }
.r-more li:last-child { padding-bottom: 0; }
.r-more li::before { content: ""; position: absolute; left: 0; top: .65em; width: 8px; height: 2px; background: var(--blue); }

/* cards (phases) */
.card { background: #FFFFFF; border: 1px solid var(--hairline); border-top: 4px solid var(--blue); }
.card .wm { color: rgba(23,55,97,.05); }
.card .tag, .card:nth-child(1) .tag, .card:nth-child(2) .tag, .card:nth-child(3) .tag { background: var(--sky-wash); color: var(--deep); font-size: 12px; }
.card h4 { color: var(--navy); font-size: 25px; }
.card p { color: var(--cream-dim); font-size: 19px; }

/* steps */
.step { background: var(--cardfill); border: 1px solid var(--hairline); }
.step::before { color: var(--blue); font-size: 14px; }
.step h4 { color: var(--navy); font-size: 22px; }
.step p { color: var(--cream-dim); font-size: 18px; }

/* lists and splits */
.list h5, .split h5 { color: var(--blue); font-size: 14px; }
.list li, .split li { color: var(--navy); font-size: 22px; line-height: 1.45; padding-bottom: 12px; }
.list li::before, .split li::before { background: var(--gold); height: 3px; width: 10px; }
.split > div, .split > div:first-child, .split > div:last-child, .split.neutral > div { background: var(--cardfill); border: 1px solid var(--hairline); }
.split > div:first-child { border-top: 4px solid var(--blue); }
.split > div:last-child { border-top: 4px solid var(--deep); }
.split > div:first-child h5 { color: var(--blue); }
.split > div:last-child h5, .split.neutral > div h5 { color: var(--deep); }

/* checklist */
.checklist li { background: #FFFFFF; border: 1px solid var(--hairline); color: var(--navy); font-size: 23px; padding: 16px 20px; }
.checklist li .box { border-color: var(--blue); width: 24px; height: 24px; }
.checklist li.on { border-color: var(--blue); background: var(--sky-wash); }
.checklist li.on .box { background: var(--blue); border-color: var(--blue); }
.checklist li.on .box::after { border-color: #FFFFFF; left: 7px; top: 3px; }

/* discussion prompt */
.discuss { border: none; background: var(--navy); padding: 18px 24px; margin-top: 4px; }
.discuss .dl { color: var(--gold); font-size: 12px; }
.discuss p { color: #FFFFFF; font-size: 22px; line-height: 1.45; }

/* drop-downs at the foot of a slide */
.mores { margin-top: 6px; }
.more { border-top: 1px solid var(--hairline); }
.more:last-child { border-bottom: 1px solid var(--hairline); }
.more summary { color: var(--deep); font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.more summary::before { content: "+"; color: var(--blue); }
.more[open] summary::before { content: "\2212"; }
.more summary:hover { color: var(--blue); }
.more ul { color: var(--navy); font-size: 19px; line-height: 1.5; }

/* deck controls */
.deckbar { background: rgba(255,255,255,.94); border: 1px solid var(--hairline); color: var(--cream-dim); box-shadow: 0 4px 18px rgba(23,55,97,.08); }
.deckbar button { color: var(--navy); border-color: var(--hairline); }
.deckbar button:hover { border-color: var(--blue); color: var(--blue); }
.progress { background: var(--gold); height: 4px; }
a:focus-visible, summary:focus-visible, .checklist li:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

@media (max-width: 1000px) {
  html, body { font-size: 19px; }
  .row, .row.nopts { grid-template-columns: 1fr; gap: 12px; }
  .slide.cover { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .slide.cover .count { right: 16px; }
}
.slide.cover .ogs-logo { filter: brightness(0) invert(1); }

/* fit each slide on one screen: example cards in a two-column grid, tighter rhythm */
.slide { padding: 40px 0 34px; }
.slide .sec-title { margin-bottom: 18px; }
.slide .lede { margin-bottom: 26px; }
.blk { margin-bottom: 22px; }
.rows.grid2 { grid-template-columns: 1fr 1fr; gap: 16px; }
.rows.grid2 .row, .rows.grid2 .row.nopts { grid-template-columns: 1fr; gap: 8px; padding: 22px 24px; align-content: start; }
.rows.grid2 .row:last-child:nth-child(odd) { grid-column: 1 / -1; }
.rows.grid2 .row h4 { font-size: 24px; }
.rows.grid2 .r-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rows.grid2 .row .tag { margin-bottom: 0; order: 2; }
.rows.grid2 .row .r-body { font-size: 20px; }
.split li { font-size: 20px; padding-bottom: 9px; }
.callout-blk { font-size: 22px; padding: 18px 24px; }
.discuss { padding: 14px 22px; }
.discuss p { font-size: 21px; }
@media (max-width: 1000px) { .rows.grid2 { grid-template-columns: 1fr; } }
.rows.grid2 { gap: 14px; }
.rows.grid2 .row, .rows.grid2 .row.nopts { padding: 18px 22px; gap: 6px; }
.rows.grid2 .r-more { margin-top: 6px; }

/* full-width stacked rows (slide 04): title left, text and examples right */
.rows.stack { gap: 12px; }
.rows.stack .row, .rows.stack .row.nopts { grid-template-columns: minmax(240px, 0.75fr) minmax(0, 2.25fr); gap: 28px; padding: 18px 28px; align-items: start; }
.rows.stack .row h4 { font-size: 25px; }
.rows.stack .r-body { font-size: 20px; }
.rows.stack .r-more { margin-top: 6px; }
@media (max-width: 1000px) { .rows.stack .row, .rows.stack .row.nopts { grid-template-columns: 1fr; gap: 8px; } }
/* wider: blocks use the full page width so cards are not capped at 1000px */
body.present .page { max-width: 1480px; }
.blk, .callout-blk, .discuss, .mores, .more { max-width: none; }
.slide .sec-title { max-width: 1200px; }
.rows.stack .row, .rows.stack .row.nopts { padding: 16px 28px; grid-template-columns: minmax(300px, 0.8fr) minmax(0, 2.6fr); }
.rows.stack .row h4 { font-size: 26px; }
.rows.stack .r-body { font-size: 21px; }

/* breathing room: more space between boxes and between blocks on every slide */
.blk { margin-bottom: 40px; }
.slide .lede { margin-bottom: 36px; }
.rows, .rows.stack, .rows.grid2 { gap: 26px; }
.stats { gap: 26px; }
.cards { gap: 26px; }
.steps { gap: 22px; }
.split { gap: 30px; }
.checklist { gap: 16px; }
.discuss { margin: 0 0 30px; }
.mores { margin-top: 0; }
body.present .slide { padding: 26px 0 18px; }
body.present .slide .lede { margin-bottom: 30px; }
body.present .blk { margin-bottom: 32px; }
body.present .rows.stack { gap: 22px; }
/* stacked rows with tags (slide 05): tag sits beside the title, wider title column */
.rows.stack .r-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.rows.stack .row .tag { margin-bottom: 0; order: 2; }
body.present .rows.stack .row, body.present .rows.stack .row.nopts { grid-template-columns: minmax(420px, 1fr) minmax(0, 2fr); }
body.present .slide .lede { max-width: 1200px; }
.rows.stack .r-head { flex-direction: column; align-items: flex-start; gap: 8px; }
body.present .rows.stack .row, body.present .rows.stack .row.nopts { grid-template-columns: minmax(460px, 1.1fr) minmax(0, 2fr); padding: 14px 28px; }
body.present .rows.stack .row h4 { white-space: nowrap; }
body.present .rows.stack .row, body.present .rows.stack .row.nopts { grid-template-columns: 410px minmax(0, 1fr); gap: 24px; }
body.present .rows.stack .row, body.present .rows.stack .row.nopts { grid-template-columns: 440px minmax(0, 1fr); }

/* links to live posts and pages */
.slide a { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-color: rgba(0,58,146,.35); }
.slide a:hover { text-decoration-color: var(--blue); }
.slide a::after { content: "\2197"; font-size: .7em; margin-left: 3px; vertical-align: .3em; display: inline-block; text-decoration: none; }
.slide.cover a { color: #FFFFFF; }
/* status tags on the commitments slide */
.rows .tag { font-weight: 700; }
.row[data-status="wip"] .tag { background: var(--navy); color: #FFFFFF; }
/* password gate */
body.locked .layout, body.locked .deckbar, body.locked .progress { display: none !important; }
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--navy); }
#gate .gatebox { width: 100%; max-width: 460px; color: #FFFFFF; }
#gate .ogs-logo { filter: brightness(0) invert(1); width: 64px; height: auto; }
#gate .gk { font-family: var(--font-mono, "Space Mono", monospace); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: 36px 0 0; }
#gate .gh { font-family: var(--font-head, Georgia, serif); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 12px 0 0; color: #FFFFFF; }
#gate .gp { font-size: 17px; line-height: 1.5; color: rgba(255,255,255,.82); margin: 14px 0 0; }
#gate form { display: flex; gap: 8px; margin-top: 26px; }
#gate input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); color: #FFFFFF; border-radius: 0; }
#gate input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
#gate button { font-family: var(--font-mono, "Space Mono", monospace); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; background: var(--gold); color: var(--navy); border: 0; padding: 0 20px; cursor: pointer; border-radius: 0; }
#gate .gerr { min-height: 22px; font-size: 15px; color: #FFFFFF; margin: 12px 0 0; }
#gate .gcredit { font-family: var(--font-mono, "Space Mono", monospace); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-top: 36px; }

/* NU: status table (stacked rows) needs a wider title column so long titles never run into the status text */
.rows.stack .row, .rows.stack .row.nopts, body.present .rows.stack .row, body.present .rows.stack .row.nopts { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) !important; align-items: center; column-gap: 40px; }
.rows.stack .row h4 { white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 760px) { .rows.stack .row, .rows.stack .row.nopts { grid-template-columns: 1fr !important; } }

function fill(e,text){const re=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;let last=0,m;while((m=re.exec(text))){if(m.index>last)e.append(document.createTextNode(text.slice(last,m.index)));const a=document.createElement('a');a.href=m[2];a.target='_blank';a.rel='noopener';a.textContent=m[1];e.append(a);last=re.lastIndex}if(last<text.length)e.append(document.createTextNode(text.slice(last)))}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)fill(e,String(text));return e}
function ul(items){const u=el('ul');(items||[]).forEach(t=>u.append(el('li',null,t)));return u}
const deck=document.getElementById('deck'), nav=document.getElementById('nav-links');
const total=D.slides.length;
D.slides.forEach((s,i)=>{
  const n=String(i+1).padStart(2,'0');
  const sec=el('section','slide gs'+(i===0?' cover':''));sec.id=s.id||('s'+n);
  sec.append(el('div','count',n+' / '+String(total).padStart(2,'0')));
  if(i===0){
    const hero=el('header','hero');const img=el('img','ogs-logo');img.src=LOGO;img.alt='OGS Media';hero.append(img);
    hero.append(el('div','hero-eyebrow',D.meta.date_label||s.kicker));
    const h=el('h1','hero-title');h.append(document.createTextNode((s.title||D.meta.title)+' '));if(s.accent)h.append(el('span','accent',s.accent));hero.append(h);
    if(s.lede)hero.append(el('p','hero-sub',s.lede));
    const m=el('div','cover-meta');m.append(el('span','lime',D.meta.cover_meta||''));hero.append(m);
    const hint=el('div','cover-hint');hint.innerHTML='Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move between slides &middot; <kbd>P</kbd> for present mode';hero.append(hint);
    sec.append(hero);
  } else {
    sec.append(el('div','sec-num',s.kicker?(n+' · '+s.kicker):n));
    const h=el('h2','sec-title');h.append(document.createTextNode(s.title+(s.accent?' ':'')));if(s.accent)h.append(el('span','accent',s.accent));sec.append(h);
    if(s.lede)sec.append(el('p','lede',s.lede));
  }
  (s.blocks||[]).forEach(b=>{
    let w;
    if(b.type==='stats'){w=el('div','blk stats');b.items.forEach(x=>{const c=el('div','stat');c.append(el('div','n',x.n),el('div','l',x.label));w.append(c)})}
    else if(b.type==='cards'&&b.layout==='rows'){w=el('div','blk rows'+(b.collapse&&!b.stack?' grid2':'')+(b.stack?' stack':''));b.items.forEach((x,j)=>{const c=el('div','row');if(x.status)c.dataset.status=x.status;const pn=((x.tag||'').match(/\d/)||[])[0];if(pn)c.dataset.p=pn;const hd=el('div','r-head');if(x.tag)hd.append(el('div','tag',x.tag));hd.append(el('h4',null,x.title));c.append(hd);const col=el('div','r-col');col.append(el('p','r-body',x.body||''));c.append(col);if(!(x.points&&x.points.length))c.classList.add('nopts');if(x.points&&x.points.length){if(b.collapse){c.classList.add('nopts');const dt=el('details','r-more');dt.append(el('summary',null,b.pointsLabel||'Examples'),ul(x.points));col.append(dt)}else{const pt=el('div','r-pts');pt.append(el('div','r-label',b.pointsLabel||'What it looks like'));pt.append(ul(x.points));c.append(pt)}}w.append(c)})}
    else if(b.type==='cards'){w=el('div','blk cards');w.style.setProperty('--cols',b.cols||Math.min(3,b.items.length));b.items.forEach((x,j)=>{const c=el('div','card');if(b.numbered!==false&&b.items.length>1)c.append(el('div','wm',String(j+1).padStart(2,'0')));if(x.tag)c.append(el('div','tag',x.tag));if(x.title)c.append(el('h4',null,x.title));if(x.body)c.append(el('p',null,x.body));if(x.points&&x.points.length)c.append(ul(x.points));w.append(c)})}
    else if(b.type==='steps'){w=el('div','blk steps');b.items.forEach(x=>{const c=el('div','step');c.append(el('h4',null,x.title));if(x.body)c.append(el('p',null,x.body));w.append(c)})}
    else if(b.type==='list'){w=el('div','blk list');if(b.title)w.append(el('h5',null,b.title));w.append(ul(b.items))}
    else if(b.type==='split'){w=el('div','blk split'+(b.tone?' '+b.tone:''));[b.left,b.right].forEach(x=>{const c=el('div');c.append(el('h5',null,x.title),ul(x.items));w.append(c)})}
    else if(b.type==='quote'){w=el('div','blk quote');w.append(el('p',null,'“'+b.text+'”'));if(b.source)w.append(el('div','src',b.source))}
    else if(b.type==='quotes'){w=el('div','blk quotes');b.items.forEach(q=>{const c=el('div','quote');c.append(el('p',null,'“'+q.text+'”'));if(q.source)c.append(el('div','src',q.source));w.append(c)})}
    else if(b.type==='checklist'){w=el('ul','blk checklist');b.items.forEach(t=>{const li=el('li');li.append(el('span','box'),el('span',null,t));li.tabIndex=0;li.setAttribute('role','checkbox');li.setAttribute('aria-checked','false');const tg=()=>{li.classList.toggle('on');li.setAttribute('aria-checked',li.classList.contains('on'))};li.addEventListener('click',tg);li.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tg()}});w.append(li)})}
    else if(b.type==='callout'){w=el('div','blk callout-blk',b.text)}
    if(w)sec.append(w);
  });
  if(s.discuss&&s.discuss.length){const d=el('div','discuss');d.append(el('div','dl','For discussion'));s.discuss.forEach(t=>d.append(el('p',null,t)));sec.append(d)}
  if(s.details&&s.details.length){const m=el('div','mores');s.details.forEach(x=>{const det=el('details','more');det.append(el('summary',null,x.title),ul(x.items));m.append(det)});sec.append(m)}
  deck.append(sec);
  const a=el('a');a.href='#'+sec.id;a.append(el('span','n',n),document.createTextNode(s.nav||s.title));nav.append(a);
});
const secs=[...document.querySelectorAll('section.slide')], links=[...nav.querySelectorAll('a')];
let cur=0;
const pos=document.getElementById('pos'), bar=document.getElementById('progress');
function mark(i){cur=i;links.forEach((a,j)=>a.classList.toggle('active',j===i));pos.textContent=String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');bar.style.width=((i+1)/total*100)+'%'}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)mark(secs.indexOf(e.target))})},{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>io.observe(s));
function go(i){i=Math.max(0,Math.min(total-1,i));secs[i].scrollIntoView({behavior:'smooth',block:'start'});mark(i)}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
const modeBtn=document.getElementById('mode');
function togglePresent(){document.body.classList.toggle('present');modeBtn.textContent=document.body.classList.contains('present')?'Exit':'Present';setTimeout(()=>go(cur),60)}
modeBtn.onclick=togglePresent;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,[role=checkbox]'))return;if(['ArrowRight','PageDown','ArrowDown'].includes(e.key)&&!e.shiftKey){if(e.key!=='ArrowDown'||document.body.classList.contains('present')){e.preventDefault();go(cur+1)}}else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){if(e.key!=='ArrowUp'||document.body.classList.contains('present')){e.preventDefault();go(cur-1)}}else if(e.key==='p'||e.key==='P'){togglePresent()}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(total-1)}});
mark(0);
}
(function(){
  const P=document.getElementById('payload');
  if(!P){renderDeck(JSON.parse(document.getElementById('deck-data').textContent));return;}
  document.body.classList.add('locked');
  const gate=document.getElementById('gate'),form=document.getElementById('pwform'),input=document.getElementById('pw'),err=document.getElementById('err');
  gate.hidden=false;
  const data=JSON.parse(P.textContent);
  const b64=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return u};
  form.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';
    if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot open the deck. Try Chrome, Safari or Edge.';return}
    try{
      const mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),{name:'PBKDF2'},false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.salt),iterations:data.iter,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.iv)},key,b64(data.ct)));
      const tmp=document.createElement('div');tmp.innerHTML=pt;
      gate.hidden=true;document.body.classList.remove('locked');
      renderDeck(JSON.parse(tmp.querySelector('#deck-data').textContent));
      window.scrollTo(0,0);
    }catch(x){err.textContent='That password did not work. Check it and try again.';input.value='';input.focus()}
  });
})();
</script>
