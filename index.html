:root{
  --ink:#0b0c0e; --surface:#1a1e23; --hair:#2a2e34;
  --paper:#f4efe8; --mute:#8a9099; --coral:#ff5e4d; --signal:#e8ff59;
  --display:"Zodiak",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
  --s:1;
}
*{box-sizing:border-box; border-radius:0}
[hidden]{display:none !important}
html,body{margin:0; height:100%; background:var(--ink); color:var(--paper)}
body{font-family:var(--body); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden}
::selection{background:var(--signal); color:var(--ink)}

/* Stage: one slide at a time, scaled to fit */
.frame{position:fixed; inset:0; display:none; align-items:center; justify-content:center; overflow:hidden}
.frame.on{display:flex}
.slide{flex:none; position:relative; width:1920px; height:1080px; background:var(--ink); overflow:hidden; transform:scale(var(--s)); transform-origin:center center}

/* Stacked reading mode for phones and narrow windows */
body.stack{overflow:auto}
body.stack #deck{padding:16px 0}
body.stack .frame{position:relative; inset:auto; display:block; width:calc(1920px * var(--s)); height:calc(1080px * var(--s)); margin:0 auto 16px; outline:1px solid var(--hair)}
body.stack .slide{transform-origin:0 0}
body.stack .controls{display:none}

/* Slide furniture */
.pad{position:absolute; inset:96px 112px 0 112px}
.kicker{font:400 24px/1.2 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--mute)}
h1,h2{font-family:var(--display); font-weight:400; letter-spacing:-.012em; text-wrap:balance; margin:0}
h2{font-size:68px; line-height:1.08; margin-top:24px; max-width:1640px}
.foot{position:absolute; left:112px; right:112px; bottom:50px; display:flex; justify-content:space-between; align-items:baseline}
.wm{font:italic 400 30px/1 var(--display); color:var(--paper); letter-spacing:-.02em}
.wm span{font:700 21px/1 var(--mono); font-style:normal; letter-spacing:.06em; margin-left:12px}
.pg{font:400 20px/1 var(--mono); letter-spacing:.12em; color:var(--mute)}
.note{font:400 26px/1.4 var(--body); color:var(--mute); max-width:1640px}

/* Links to live posts */
.slide a{color:inherit; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:7px; text-decoration-color:rgba(244,239,232,.35)}
.slide a:hover{text-decoration-color:currentColor}
.slide a::after{content:"\2197"; font-family:var(--body); font-size:.62em; margin-left:6px; vertical-align:.38em; text-decoration:none; display:inline-block}

/* Bullets */
.pts{list-style:none; margin:0; padding:0}
.pts li{position:relative; font:400 36px/1.36 var(--body); padding-left:44px; margin:0 0 22px; text-wrap:pretty}
.pts li::before{content:""; position:absolute; left:0; top:.68em; width:22px; height:2px; background:var(--mute)}
.pts b{font-weight:600; color:var(--coral)}

/* Big numbers */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:64px; margin-top:56px}
.stat .n{font:400 112px/1 var(--display); color:var(--coral); letter-spacing:-.02em; white-space:nowrap}
.stat .l{font:400 24px/1.4 var(--mono); color:var(--mute); margin-top:16px; max-width:470px}

/* Slide 1 */
.ring{position:absolute; right:-250px; top:-250px; width:640px; height:640px; border:1.5px solid rgba(244,239,232,.2); border-radius:50%}
.title .pad{inset:0 112px}
.title .kicker{position:absolute; top:330px; left:0}
.title h1{position:absolute; top:392px; left:-6px; font-size:156px; line-height:1}
.title .sub{position:absolute; top:748px; left:0; font:400 40px/1.3 var(--body); color:var(--mute)}
.title .foot .tag{font:400 26px/1 var(--body); color:var(--mute)}

/* Slide 2: commitments */
.rows{margin-top:52px; border-top:1px solid var(--hair)}
.row{display:grid; grid-template-columns:720px 200px 1fr; column-gap:36px; align-items:center; padding:26px 0; border-bottom:1px solid var(--hair)}
.row .a{font:400 36px/1.3 var(--body)}
.row .c{font:400 31px/1.3 var(--body); color:var(--mute)}
.st{justify-self:start; font:700 19px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; padding:10px 14px; border:1.5px solid var(--paper); color:var(--paper)}
.st.wip{border-color:var(--coral); color:var(--coral)}

/* Two columns */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:80px; margin-top:60px}
.cols .lab{font:400 22px/1.2 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--coral); margin-bottom:28px}
.cols .pts li{font-size:36px}

/* Numbered focus list */
.steps{list-style:none; margin:56px 0 0; padding:0; counter-reset:s}
.steps li{counter-increment:s; display:grid; grid-template-columns:90px 1fr; align-items:baseline; font:400 38px/1.3 var(--body); padding:20px 0; border-bottom:1px solid var(--hair)}
.steps li:first-child{border-top:1px solid var(--hair)}
.steps li::before{content:"0" counter(s); font:400 24px/1 var(--mono); color:var(--mute); letter-spacing:.1em}

/* The one AI-citation moment */
.cite{display:flex; gap:22px; align-items:baseline; font:400 32px/1.4 var(--body); margin-top:40px; padding-top:34px; border-top:1px solid var(--hair)}
.cite .mark{flex:none; width:18px; height:18px; background:var(--signal); transform:translateY(-2px)}
.cite b{font-weight:600}

/* Asks */
.asks .pts li{font-size:35px; margin-bottom:16px}
.back{font:400 30px/1.5 var(--body); margin-top:26px; padding-top:26px; border-top:1px solid var(--hair)}
.back b{font-weight:600; color:var(--coral)}

/* Controls (present mode) */
.controls{position:fixed; right:18px; bottom:16px; display:flex; gap:6px; opacity:0; transition:opacity .25s; z-index:5}
body.awake .controls{opacity:1}
.controls button{font:400 13px/1 var(--mono); letter-spacing:.08em; background:var(--surface); color:var(--paper); border:1px solid var(--hair); padding:10px 12px; cursor:pointer}
.controls button:hover{border-color:var(--mute)}
.controls button:focus-visible{outline:2px solid var(--signal); outline-offset:2px}

/* Password gate */
#gate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto}
.gatebox{width:100%; max-width:460px}
.glock{font:italic 400 24px/1 var(--display); letter-spacing:-.02em}
.glock span{font:700 16px/1 var(--mono); font-style:normal; letter-spacing:.06em; margin-left:8px}
.gk{font:400 12px/1.4 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--mute); margin:44px 0 0}
.gh{font:400 40px/1.1 var(--display); letter-spacing:-.012em; margin:14px 0 0}
.gp{font:400 17px/1.5 var(--body); color:var(--mute); margin:16px 0 0}
#pwform{display:flex; gap:8px; margin-top:28px}
#pw{flex:1; min-width:0; font:400 17px/1 var(--body); color:var(--paper); background:var(--surface); border:1px solid var(--hair); padding:14px 14px}
#pw:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:transparent}
#go{font:700 14px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; background:var(--signal); color:var(--ink); border:0; padding:0 20px; cursor:pointer}
.gerr{min-height:22px; font:400 15px/1.4 var(--body); color:var(--coral); margin:14px 0 0}
.gcredit{font:400 11px/1.4 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin-top:40px}
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="gatebox">
    <div class="glock">OGS<span>MEDIA</span></div>
    <p class="gk">Monthly review · 20 October 2026</p>
    <h2 class="gh">National University</h2>
    <p class="gp">This deck is confidential. Enter the password to view it.</p>
    <form id="pwform" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" autocomplete="off" aria-label="Password" autofocus>
      <button id="go" type="submit">View</button>
    </form>
    <p id="err" class="gerr" role="alert"></p>
    <p class="gcredit">Prepared by OGS Media for National University</p>
  </div>
</div>

<main id="deck"><!--SLIDES--><!--/SLIDES--></main>

<div class="controls" aria-label="Slide controls">
  <button type="button" id="prev" aria-label="Previous slide">PREV</button>
  <button type="button" id="count" aria-label="Slide number" tabindex="-1">1 / 8</button>
  <button type="button" id="next" aria-label="Next slide">NEXT</button>

<script>
(function(){
  var started=false;
  function initDeck(){
    if(started)return; started=true;
    var frames=[].slice.call(document.querySelectorAll('.frame'));
    var n=frames.length, i=0, timer;
    var count=document.getElementById('count');
    function fit(){
      var w=window.innerWidth, h=window.innerHeight;
      var stack=w<900 || h>w*1.15;
      document.body.classList.toggle('stack',stack);
      var s=stack ? (w-32)/1920 : Math.min(w/1920,h/1080);
      document.documentElement.style.setProperty('--s',s);
    }
    function show(k){
      i=Math.max(0,Math.min(n-1,k));
      frames.forEach(function(f,j){f.classList.toggle('on',j===i);});
      count.textContent=(i+1)+' / '+n;
      try{history.replaceState(null,'','#'+(i+1));}catch(e){}
    }
    function wake(){document.body.classList.add('awake'); clearTimeout(timer); timer=setTimeout(function(){document.body.classList.remove('awake');},1800);}
    document.addEventListener('keydown',function(e){
      if(document.body.classList.contains('stack'))return;
      var k=e.key;
      if((k==='Enter'||k===' ')&&e.target.closest&&e.target.closest('a,button,input'))return;
      if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();show(i+1);}
      else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();show(i-1);}
      else if(k==='Home'){show(0);} else if(k==='End'){show(n-1);}
      else if(k==='f'||k==='F'){toggleFull();}
    });
    function toggleFull(){
      var d=document;
      if(!d.fullscreenElement){(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);}
      else{d.exitFullscreen();}
    }
    document.getElementById('prev').onclick=function(){show(i-1);};
    document.getElementById('next').onclick=function(){show(i+1);};
    document.getElementById('full').onclick=toggleFull;
    document.addEventListener('mousemove',wake);
    window.addEventListener('resize',fit);
    fit();
    var h=parseInt((location.hash||'').slice(1),10);
    show(h>0?h-1:0);
  }

  var P=document.getElementById('payload');
  if(!P){initDeck(); return;}

  var gate=document.getElementById('gate'), deck=document.getElementById('deck');
  var form=document.getElementById('pwform'), input=document.getElementById('pw'), err=document.getElementById('err');
  var data=JSON.parse(P.textContent);
  document.body.style.overflow='auto';
  gate.hidden=false;
  function b64(s){var bin=atob(s), u=new Uint8Array(bin.length); for(var k=0;k<bin.length;k++){u[k]=bin.charCodeAt(k);} return u;}
  async function unlock(pass){
    err.textContent='';
    if(!(window.crypto&&window.crypto.subtle)){err.textContent='This browser cannot open the deck. Try Chrome, Safari or Edge.';return;}
    try{
      var enc=new TextEncoder();
      var mat=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.salt),iterations:data.iter,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.iv)},key,b64(data.ct));
      deck.innerHTML=new TextDecoder().decode(pt);
      gate.hidden=true; document.body.style.overflow='';
      initDeck();
    }catch(e){err.textContent='That password did not work. Check it and try again.'; input.value=''; input.focus();}
  }
  form.addEventListener('submit',function(e){e.preventDefault(); unlock(input.value);});
})();
</script>
